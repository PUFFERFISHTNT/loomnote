name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Exercise the same setup and launch entry points used by Windows/macOS users.
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Run before any tool setup. Restrict PATH so runner preinstalls cannot
      # hide a dependency on global Node/npm/pnpm/Git or the user's shell.
      - name: Fresh-machine bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          LOOMNOTE_PORTABLE_NODE: '1'
          LOOMNOTE_DATA_DIR: ${{ runner.temp }}/loomnote-fresh-bootstrap
          NODE_GYP_FORCE_PYTHON: ${{ runner.temp }}/loomnote-no-python
          CC: loomnote-no-c-compiler
          CXX: loomnote-no-cxx-compiler
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          .\setup.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\start.cmd --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh-machine bootstrap (macOS)
        if: runner.os != 'Windows'
        env:
          LOOMNOTE_PORTABLE_NODE: '1'
          LOOMNOTE_DATA_DIR: ${{ runner.temp }}/loomnote-fresh-bootstrap
          NODE_GYP_FORCE_PYTHON: ${{ runner.temp }}/loomnote-no-python
          CC: loomnote-no-c-compiler
          CXX: loomnote-no-cxx-compiler
        run: |
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          ./scripts/setup.sh
          ./start.command --smoke
      - uses: pnpm/action-setup@v4
        # 版本自动读取 package.json 的 packageManager 字段
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Electron binary
        run: pnpm setup:electron
      - name: One-click setup
        if: runner.os != 'Windows'
        run: ./scripts/setup.sh
      - name: One-click setup (Windows)
        if: runner.os == 'Windows'
        run: .\setup.cmd
      - name: Portable Node bootstrap (macOS)
        if: runner.os != 'Windows'
        run: source scripts/runtime.sh && "$LOOMNOTE_NODE" --version
        env:
          LOOMNOTE_PORTABLE_NODE: '1'
      - name: Portable Node bootstrap (Windows)
        if: runner.os == 'Windows'
        run: . ./scripts/runtime.ps1; & $LoomNoteRuntimeNode --version
        env:
          LOOMNOTE_PORTABLE_NODE: '1'
      - name: One-click launch smoke (macOS)
        if: runner.os != 'Windows'
        run: ./start.command --smoke
        env:
          LOOMNOTE_DATA_DIR: ${{ runner.temp }}/loomnote-launch-smoke
      - name: One-click launch smoke (Windows)
        if: runner.os == 'Windows'
        run: .\start.cmd --smoke
        env:
          LOOMNOTE_DATA_DIR: ${{ runner.temp }}/loomnote-launch-smoke
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Offline tests
        run: pnpm test
      - name: Native module load smoke (better-sqlite3 + electron)
        working-directory: apps/desktop
        run: |
          node -e "try{const {createRequire}=require('module');const req=createRequire(process.cwd()+'/package.json');const D=req('better-sqlite3');const db=new D(':memory:');db.pragma('journal_mode = WAL');db.exec('create table t(a)');db.prepare('insert into t values (?)').run(1);console.log('sqlite smoke OK',db.prepare('select a from t').get().a)}catch(e){console.log('sqlite binding unavailable in this env (app falls back to JSON):',e.message.split('\n')[0])}"
          pnpm build
      - name: Desktop workflow and restart persistence
        run: pnpm test:desktop
        env:
          LOOMNOTE_ARTIFACTS_DIR: artifacts/desktop
      - name: Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/setup.ps1', 'scripts/start.ps1', 'scripts/runtime.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          }
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: artifacts/desktop
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: loomnote-dev-${{ matrix.os }}
          path: apps/desktop/out
          if-no-files-found: error
